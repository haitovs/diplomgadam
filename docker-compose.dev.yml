# Local development dependencies only. The application itself runs on the host
# via `npm run dev`. For the production stack see docker-compose.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tagam-postgres-dev
    environment:
      POSTGRES_USER: tagam
      POSTGRES_PASSWORD: tagam
      POSTGRES_DB: tagam_dev
    ports:
      - "5433:5432"
    volumes:
      - tagam-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tagam -d tagam_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tagam-dev-db:
